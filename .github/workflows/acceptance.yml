name: Runtime acceptance

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: python -m unittest discover -s tests
        working-directory: bridge/python
      - run: go test -mod=mod ./...
        working-directory: cluster
      - run: python cluster/test_workflow.py
      - run: docker pull python:3.12-alpine
      - run: go test -count=1 -v ./pkg/sandbox -run TestDockerSandboxIntegration
        env:
          OCTPEX_TEST_SANDBOX_IMAGE: python:3.12-alpine
