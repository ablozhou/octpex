apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octpex.fullname" . }}
  labels:
    {{- include "octpex.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "octpex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octpex.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "-profile=cluster", "-config=/etc/octpex/cluster.yaml", "-port=8080"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/topology
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/topology
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/octpex
      volumes:
        - name: config
          configMap:
            name: {{ include "octpex.fullname" . }}-config
