apiVersion: v1
kind: Namespace
metadata:
  name: octpex-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: octpex-cluster-config
  namespace: octpex-system
data:
  cluster.yaml: |
    profile: cluster
    brain:
      max_parallel_tasks: 16
      escalation_timeout_ms: 30000
      frontier_provider: "openai"
      frontier_base_url: "https://api.openai.com/v1"
      frontier_model: "gpt-4o"
      frontier_temperature: 0.1
    ring:
      registry_type: "etcd"
      heartbeat_ttl: 5000000000
      sweep_interval: 2000000000
      endpoints:
        - "etcd-cluster.octpex-system.svc.cluster.local:2379"
      lease_ttl_seconds: 5
    substrate:
      type: "redis"
      default_ttl: 86400000000000
      endpoint: "redis-cluster.octpex-system.svc.cluster.local:6379"
      key_prefix: "octpex:sub:"
    bus:
      type: "nats_jetstream"
      buffer_size: 4096
      url: "nats://nats-cluster.octpex-system.svc.cluster.local:4222"
      queue_group: "octpex-arm-workers"
      vertical_subject: "octpex.vertical.dispatch.*"
      lateral_subject: "octpex.lateral.handoff.*"
    sandbox:
      provider: "abloex"
      memory_limit_mb: 512
      timeout: 10000000000
      network_isolated: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octpex-kernel
  namespace: octpex-system
  labels:
    app.kubernetes.io/name: octpex-kernel
    app.kubernetes.io/part-of: octpex
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: octpex-kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octpex-kernel
    spec:
      containers:
        - name: octpex-kernel
          image: octpex/kernel:latest
          imagePullPolicy: IfNotPresent
          args: ["run", "-profile=cluster", "-config=/etc/octpex/cluster.yaml", "-port=8080"]
          ports:
            - containerPort: 8080
              name: http-api
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/octpex
          livenessProbe:
            httpGet:
              path: /api/v1/topology
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/topology
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: octpex-cluster-config
---
apiVersion: v1
kind: Service
metadata:
  name: octpex-service
  namespace: octpex-system
  labels:
    app.kubernetes.io/name: octpex-kernel
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-api
  selector:
    app.kubernetes.io/name: octpex-kernel
