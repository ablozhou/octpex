apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-app-log-generator
  namespace: octpex-system
  labels:
    app: mock-app-log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-app-log-generator
  template:
    metadata:
      labels:
        app: mock-app-log-generator
    spec:
      volumes:
        - name: app-log-volume
          emptyDir: {}
      containers:
        # 1. 模拟业务应用：向共享卷持续输出高频运行日志与重复 ERROR 异常
        - name: log-producer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/mock-app
              echo "Starting simulated mock app log generator..."
              while true; do
                TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
                echo "$TIMESTAMP INFO [OrderService] Incoming checkout request order_id=ORD-9021 user_id=U-102" >> /var/log/mock-app/app.log
                echo "$TIMESTAMP ERROR [PaymentGateway] Connection timeout: payment provider downstream is slow" >> /var/log/mock-app/app.log
                echo "$TIMESTAMP ERROR [PaymentGateway] Connection timeout: payment provider downstream is slow" >> /var/log/mock-app/app.log
                echo "$TIMESTAMP ERROR [PaymentGateway] Connection timeout: payment provider downstream is slow" >> /var/log/mock-app/app.log
                echo "$TIMESTAMP INFO [OrderService] Fallback checkout queue triggered successfully" >> /var/log/mock-app/app.log
                sleep 5
              done
          volumeMounts:
            - name: app-log-volume
              mountPath: /var/log/mock-app
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

        # 2. 边缘自治收集 Sidecar：监听共享日志目录，自动打包信封派发至 Octpex 集群去噪治理
        - name: octpex-log-sidecar
          image: curlimages/curl:8.6.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting Octpex edge log harvester sidecar..."
              while true; do
                sleep 8
                if [ -f /var/log/mock-app/app.log ]; then
                  LOG_BATCH=$(tail -n 20 /var/log/mock-app/app.log)
                  TRACE_ID="trace-auto-$(date +%s)"
                  
                  # 构造并向 Octpex 中枢分发治理信封
                  PAYLOAD=$(cat <<EOF
              {
                "target_capability": "distill-telemetry",
                "envelope_id": "env-$TRACE_ID",
                "session_id": "sess-k8s-autolog",
                "trace_id": "$TRACE_ID",
                "parameters": {
                  "log": $(echo "$LOG_BATCH" | jq -R -s .)
                }
              }
              EOF
                  )
                  
                  echo "Dispatching log batch to Octpex..."
                  curl -s -X POST http://octpex-service:8080/api/v1/dispatch \
                    -H "Content-Type: application/json" \
                    -d "$PAYLOAD" || true
                fi
              done
          volumeMounts:
            - name: app-log-volume
              mountPath: /var/log/mock-app
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
